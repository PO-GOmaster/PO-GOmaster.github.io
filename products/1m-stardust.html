  <script>
    function generateCode() {
      const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let result = "";
      for (let i = 0; i < 18; i++) {
        result += chars[Math.floor(Math.random() * chars.length)];
      }
      return result;
    }
    const code = generateCode();
    document.getElementById("code").textContent = code;
